<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Sistema de Créditos</title>
</head>
<body>

<header>
  <h1>Sistema Básico de Créditos</h1>
   <link rel="stylesheet" href="simulador_completo.css">
</header>

<nav>
  <button onclick="mostrarSeccion('parametros');">Parámetros</button>
  <button onclick="mostrarSeccion('clientes');">Clientes</button>
  <button onclick="mostrarSeccion('credito');">Créditos</button>
  <button onclick="mostrarSeccion('contacto');">Contacto</button>
  <button onclick="mostrarSeccion('listaCreditos');">Créditos Registrados</button>
</nav>

<section id="parametros">
  <h2>Configurar Parámetros</h2>

  <label>Tasa de interés:</label>
  <input type="number" min="10" max="20" value="15" id="tasaInteres"/>
  <span>%</span>

  <br>
  <button onclick="guardarTasa();">Guardar tasa</button>

  <p id="mensajeTasa"></p>
</section>

<section id="clientes">
  <h2>Registro de Clientes</h2>

  <input type="text" placeholder="Ingresa tu cedula de identidad" id="txtCedula"/>
  <input type="text" placeholder="Ingresa tu nombre" id="txtNombre"/>
  <input type="text" placeholder="Ingresa tu apellido" id="txtApellido"/>
  <input type="number" placeholder="Ingresa tus ingresos" id="txtIngresos"/>
  <input type="number" placeholder="Ingresa tus egresos" id="txtEgresos"/>
  <input type="text" placeholder="Ingresa tus email" id="txtEmail"/>

  <br>

  <button onclick="guardarCliente();" id="btnGuardarCliente" disabled>Guardar cliente</button>
  <button onclick="limpiar();">Limpiar</button>

  <table>
    <thead>
      <tr>
        <th>Cédula</th>
        <th>Nombre</th>
        <th>Apellido</th>
        <th>Ingresos</th>
        <th>Egresos</th>
        <th>Email</th>
        <th>Acciones</th>
      </tr>
    </thead>
    <tbody id="tablaClientes">

    </tbody>
  </table>
</section>

<section id="credito">
  <h2>Solicitar Crédito</h2>

  <input type="text" id="buscarCedulaCredito" placeholder="Ingrese la cedula"/>
  <button onclick="buscarClienteCredito()">Buscar cliente</button>

  <div id="datosClienteCredito" class="card"></div>

  <input type="number" id="montoCredito" placeholder="Ingrese el monto del crédito"/>
  <input type="number" id="plazoCredito" placeholder="Ingrese el plazo del crédito"/>

  <br>

  <button id="btnClienteCredito" onclick="calcularCredito()">Calcular crédito</button>

  <div id="resultadoCredito" class="card"></div>

  <button id="btnAsignarCredito" onclick="asignarCredito()" disabled>
    Asignar crédito
  </button>

  <button id="btnSolicitarCredito" onclick="solicitarCredito()" disabled>
    Solicitar crédito
  </button>
</section>

<section id="contacto">
  Creado por: Javier Andrade
  Email: @dalimberpubg
</section>

<section id="listaCreditos">
  <h2>Créditos Registrados</h2>

  <input type="text" id="buscarCedulaListado" >
  <button onclick="buscarCreditosCliente()">Buscar</button>
  <button onclick="pintarCreditos(creditos)">Ver todos</button>

  <table>
    <thead>
      <tr>
        <th>Cédula</th>
        <th>Nombre</th>
        <th>Apellido</th>
        <th>Monto</th>
        <th>Tasa</th>
        <th>Plazo</th>
        <th>Cuota</th>
        <th>Acciones</th>
      </tr>
    </thead>
    <tbody id="tablaCreditos">
       
    </tbody>
  </table>
</section>


<script src="simulador_completo.js"></script>
<script src="utilitarios.js"></script>
<script src="funciones.js"></script>
</body>
</html>
